services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-portal:latest
    container_name: project-portal
    restart: unless-stopped
    ports:
      - "3003:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
